# data/emperors.json・data/kinship.json の恒久 QA（task.md 3-3・6-3）。
# チェック内容・エラー/警告の区分は scripts/validate_emperors.py /
# scripts/validate_kinship.py の docstring を参照。
name: Validate emperors data

on:
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "scripts/validate_emperors.py"
      - "scripts/validate_kinship.py"
      - "scripts/verify_calendar.py"
      - "scripts/verify_quotes.py"
      - "scripts/hanzi_norm.py"
      - "scripts/detect_wikipedia_sources.py"
      - "scripts/validate_readings.py"
      - "scripts/validate_profiles.py"
      - "docs/process/RULES.yml"
      - ".claude/hooks/guard.py"
      - "scripts/check_rules.py"
      - "scripts/check_regime_conventions.py"
      - "scripts/check_screenings.py"
      - "scripts/check_verification.py"
      - "scripts/screens/**"
      - "scripts/coverage.py"
      - "docs/PROJECT_STATUS.md"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate_emperors.py"
      - "scripts/validate_kinship.py"
      - "scripts/verify_calendar.py"
      - "scripts/verify_quotes.py"
      - "scripts/hanzi_norm.py"
      - "scripts/detect_wikipedia_sources.py"
      - "scripts/validate_readings.py"
      - "scripts/validate_profiles.py"
      - "docs/process/RULES.yml"
      - ".claude/hooks/guard.py"
      - "scripts/check_rules.py"
      - "scripts/check_regime_conventions.py"
      - "scripts/check_screenings.py"
      - "scripts/check_verification.py"
      - "scripts/screens/**"
      - "scripts/coverage.py"
      - "docs/PROJECT_STATUS.md"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema sxtwl opencc-python-reimplemented pyyaml

      - name: Validate emperors.json
        run: python3 scripts/validate_emperors.py

      - name: Validate kinship.json
        run: python3 scripts/validate_kinship.py

      # 暦換算リプレイ・exactDays 実経過日数ゲート（2026-07-22 note 全件検証の恒久化）
      - name: Verify calendar conversions
        run: python3 scripts/verify_calendar.py

      # 検出力テスト（合成レコード）。claim・conflicts・events の source.conversion は
      # いずれも**遡及しない任意欄**なので、実データでは 0 件に掛かる期間が長い。
      # 「0 errors」が守れているのか何も見ていないのかを実データでは区別できないため、
      # 発火そのものをここで測る（R-NOTE-CLAIM・R-EVENT-DATE-RAW の detail を参照）。
      - name: Measure gate detection power
        run: |
          python3 scripts/test_claim_field.py
          python3 scripts/test_conflicts_field.py
          python3 scripts/test_patch_emperor.py
          python3 scripts/test_event_conversion_gate.py
          python3 scripts/test_event_ids.py
          python3 scripts/test_date_claim_scope.py
          python3 scripts/test_quote_containers.py

      # ふりがな（Issue #20）。記法・親文字一致に加えて、紹介文の**総ルビ充足**と
      # 固有名詞整合はこのスクリプトにしか無い（サイトのビルドは name-readings.json
      # 側の取りこぼししか見ない）。紹介文365本を書くときに効くゲートなので、
      # ここから外すと振り漏れが素通しになる。
      - name: Validate name readings and ruby markup
        run: python3 scripts/validate_readings.py

      # 紹介文（Issue #16）。文字数（ルビを剥がした長さ）・description が平文であること・
      # meta.counts.written の整合。定型文検出の n-gram は報告のみでエラーにしない。
      - name: Validate emperor profiles
        run: python3 scripts/validate_profiles.py

      # 引用照合台帳カバレッジ（コーパス不要）。台帳 data/quote-refs.json を更新せずに
      # 引用を追加・改変したコミットはここで確実に落ちる（規約: RESEARCH_PROCESS.md 引用の取り扱い規約）
      - name: Verify quote ledger coverage
        run: python3 scripts/verify_quotes.py --check-coverage

      # 政権単位の慣行記録（data/regime-conventions.json）。人物単位の調査対象を絞る根拠なので、
      # 間違った絞り込みが一番高くつく。**コーパスは CI に無いので引用の実在検査は飛ぶ**
      # （未照合件数が出力に出る）。構造・政権 id の実在・打ち切り側の根拠の有無はここで落ちる。
      - name: Validate regime conventions
        run: python3 scripts/check_regime_conventions.py

      # 絞り込みの記録（data/screenings.json）。**記録した数字ではなく screen スクリプトを
      # 実行した結果と突き合わせる**ので、データが動いて母集団が変われば落ちる（＝絞り直しの合図）。
      # 引用の実在検査だけは上と同じ理由でコーパスが無く飛ぶ。
      - name: Validate screenings
        run: python3 scripts/check_screenings.py

      # 検証段の体数（data/verification.json）。体数が tier から一意に決まっているか、
      # 1体へ減らす側に書名・所在の根拠があるか、指摘率の記録が confirmed <= raised を
      # 満たすかを見る。所在の実在確認だけはコーパスが無いので飛ぶ。
      - name: Validate verification tiers
        run: python3 scripts/check_verification.py

      # 規則台帳（docs/process/RULES.yml）の自己検査。全規則が適用範囲と根拠を持つか、
      # .claude/hooks/guard.py の実装と台帳の強制層 L1 が一致するかを見る。
      # 台帳が実装より先に腐ると「掛かっているつもり」になるので、ここで落とす。
      # 進捗表記の実測（docs/PROJECT_STATUS.md の生成領域）。**自己申告と実測がずれたら落ちる**。
      # 「364人完了」がチェックリスト上の申告で実測は355人だった前例（2026-07-18）の再発防止で、
      # データを動かして `--write` を忘れたコミットはここで確実に落ちる。
      - name: Verify measured coverage
        run: python3 scripts/coverage.py --check

      - name: Validate rule registry
        run: python3 scripts/check_rules.py
