# data/emperors.json・data/kinship.json の恒久 QA（task.md 3-3・6-3）。
# チェック内容・エラー/警告の区分は scripts/validate_emperors.py /
# scripts/validate_kinship.py の docstring を参照。
name: Validate emperors data

on:
  push:
    branches: ["main"]
    paths:
      - "data/**"
      - "scripts/validate_emperors.py"
      - "scripts/validate_kinship.py"
      - "scripts/verify_calendar.py"
      - "scripts/verify_quotes.py"
      - "scripts/hanzi_norm.py"
      - "scripts/detect_wikipedia_sources.py"
      - "scripts/validate_readings.py"
      - "scripts/validate_profiles.py"
      - "docs/process/RULES.yml"
      - ".claude/hooks/guard.py"
      - "scripts/check_rules.py"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate_emperors.py"
      - "scripts/validate_kinship.py"
      - "scripts/verify_calendar.py"
      - "scripts/verify_quotes.py"
      - "scripts/hanzi_norm.py"
      - "scripts/detect_wikipedia_sources.py"
      - "scripts/validate_readings.py"
      - "scripts/validate_profiles.py"
      - "docs/process/RULES.yml"
      - ".claude/hooks/guard.py"
      - "scripts/check_rules.py"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema sxtwl opencc-python-reimplemented pyyaml

      - name: Validate emperors.json
        run: python3 scripts/validate_emperors.py

      - name: Validate kinship.json
        run: python3 scripts/validate_kinship.py

      # 暦換算リプレイ・exactDays 実経過日数ゲート（2026-07-22 note 全件検証の恒久化）
      - name: Verify calendar conversions
        run: python3 scripts/verify_calendar.py

      # ふりがな（Issue #20）。記法・親文字一致に加えて、紹介文の**総ルビ充足**と
      # 固有名詞整合はこのスクリプトにしか無い（サイトのビルドは name-readings.json
      # 側の取りこぼししか見ない）。紹介文365本を書くときに効くゲートなので、
      # ここから外すと振り漏れが素通しになる。
      - name: Validate name readings and ruby markup
        run: python3 scripts/validate_readings.py

      # 紹介文（Issue #16）。文字数（ルビを剥がした長さ）・description が平文であること・
      # meta.counts.written の整合。定型文検出の n-gram は報告のみでエラーにしない。
      - name: Validate emperor profiles
        run: python3 scripts/validate_profiles.py

      # 引用照合台帳カバレッジ（コーパス不要）。台帳 data/quote-refs.json を更新せずに
      # 引用を追加・改変したコミットはここで確実に落ちる（規約: RESEARCH_PROCESS.md 引用の取り扱い規約）
      - name: Verify quote ledger coverage
        run: python3 scripts/verify_quotes.py --check-coverage

      # 規則台帳（docs/process/RULES.yml）の自己検査。全規則が適用範囲と根拠を持つか、
      # .claude/hooks/guard.py の実装と台帳の強制層 L1 が一致するかを見る。
      # 台帳が実装より先に腐ると「掛かっているつもり」になるので、ここで落とす。
      - name: Validate rule registry
        run: python3 scripts/check_rules.py
