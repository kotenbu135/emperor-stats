# 運用規則の台帳（2026-08-02 新設）
#
# この台帳は規則の本文を持たない。本文は散文のドキュメント側が正で、ここが持つのは
# 「その規則はどこまで掛かるのか」と「守られなかったことを誰が検出するのか」の2つ。
#
#   scope       … 適用範囲。ここが空白だったために、データ判定の規則を紹介文にも掛かると
#                 解釈して Web 照合をしないまま76人ぶんを公開した（2026-08-02）。
#                 新しい規則を書くときは本文より先にこの欄を書く。
#   enforcement … 強制層。L0 構造で消す／L1 hook（実行の直前に止める）／
#                 L2 エージェント定義・名前つき Workflow（プロンプトに運ばれる）／
#                 L3 事後ゲート（スクリプト）／L4 ドキュメントのみ＝強制力ゼロ。
#   evidence    … その規則を書かせた実際の失敗。無い規則は「一般的な行動指示」であり、
#                 モデル世代に合わせて削ってよい（docs/process/CONSTRAINTS.md 冒頭）。
#
# **enforcement が L4 だけの規則が、次に破られる規則である。** 台帳の値はその一覧性にある。
#
# L1 の実装は .claude/hooks/guard.py（テスト: python3 .claude/hooks/test_guard.py）。
# 逃げ道は全規則共通で EMPSTATS_ALLOW="<規則ID>:<理由>" の1本だけ。理由は必須で、
# 使用は .claude/hook-log.jsonl に残る。

meta:
  updated: 2026-08-03
  layers:
    L0: 構造で消す（選ぶ工程そのものを無くす）
    L1: hook で実行の直前に止める（サブエージェント・Workflow エージェントにも掛かる）
    L2: エージェント定義・名前つき Workflow に埋め込む
    L3: 事後ゲート（validate_*.py / verify_*.py）
    L4: ドキュメントのみ（強制力ゼロ）

rules:

  - id: R-PRIMARY-SOURCE
    summary: 判定の根拠は正史の本紀・列伝の原文に置く。WebSearch の要約だけで判定しない
    scope: data/emperors.json・data/kinship.json のフィールド判定。**紹介文（Issue #16）の執筆には掛からない** — そちらでは Web を差分検出器として使ってよい（2026-08-02 ユーザー決定）
    enforcement: [L2, L3]
    detail: L2＝.claude/agents/corpus-researcher.md／L3＝verify_quotes.py（引用の実在のみ。判定の当否は機械では見ない）
    evidence: 後漢沖帝の死因で次代の記述と混同した要約を採用（2026-07-15）。適用範囲を書かなかったため紹介文76人ぶんが Web 未照合のまま公開（2026-08-02）
    source: docs/process/RESEARCH_PROCESS.md「大原則」

  - id: R-NO-AUTOGEN
    summary: スクリプトによるデータの自動生成は禁止。人物ごとの個別調査・判定が必須
    scope: data/*.json の**値の判定**。日数計算などの機械的な計算補助・確定済み結果の転記・構造チェックは対象外
    enforcement: [L2, L4]
    detail: >-
      機械で「これは判定か転記か」を判別できないため L1（deny）は無い。**境界は禁止を増やすのではなく
      道具の設計で持たせる** — 転記は `scripts/patch_emperor.py` が担当し、不変条件は
      「**出力に現れる値は、入力に literally 書かれていた値だけ**」の1つ。そのために
      計算をしない（`datetime`・`math` を import しない）／コーパスも他の JSON も読まない／
      既定値を入れない・兄弟フィールドから写さない／**1回の起動で触れるのは皇帝1人だけ**
      （「同じ規則を複数の対象へ当てる」は判定であって転記ではない）／中間コンテナを作らない
      （構造を決めるのは判定）。検査は `python3 scripts/test_patch_emperor.py`（ローカル専用）
    evidence: 過去2回失敗（docs/process/CONSTRAINTS.md）
    source: docs/process/CONSTRAINTS.md

  - id: R-NOTE-CLAIM
    summary: note は作業ログ。新しく書くときは同じコンテナに前向きな主張だけの claim を添える
    scope: >-
      data/emperors.json の判定コンテナ8つ（reign・deathCause・accessionRoute・ages・
      datedEventCount・capitalRelocationCountObject・campaignCountObject・rebellionCountObject）に
      **新しく書く note**。**既存 10,912件には遡及しない**（欄は任意）。events[] の各要素と
      source は対象外 — 前者は構造フィールド自身が witness、後者は出典帰属の経緯であって値の主張ではない。
      **ただし `outcome` が witness の側に数えられるのは、主張範囲が原典に縛られているから**
      （2026-08-07・Issue #97。自然文なので範囲の制約が外れると単独では何の witness にもならない。
      制約は data/schema/ADDITIONAL_SCHEMA.md「`events[].outcome` の主張範囲」）
    enforcement: [L3, L4]
    detail: >-
      L3＝validate_emperors.py の `check_claim_fields`。claim を持つコンテナだけを評価し、
      作業ログの印（訂正・現行・旧値・→。**史実の日本語と衝突しない語だけ** — 「に改め」「差し替え」「から変更」は改元・遷都・皇太子廃立の主張そのものに出るので入れない）／原文引用らしいスパン
      （かな無し・漢字6字以上の「」。引用照合台帳は claim を見ないので素通りする）／
      `count` の数が算用数字で出ないこと、をエラーにする。**評価件数を INFO で必ず出す**
      （0エラーが「守れている」か「何も見ていない」かを区別するため）。検出力は
      `python3 scripts/test_claim_field.py` が合成レコードで測る。
      **L4 が残るのは「書いたか」のほう** — 遡及しない任意の欄なので、書かなかったことは
      検出できない。機械が見られるのは「書いたのに後ろ向き」だけ。
      **claim は coverage.py の確定の根拠にしない**（無いのが既定なので、根拠に使うと
      書いた人物だけが確定に見える）
    evidence: Issue #40 の G2/G3（note とフィールドの突合ゲート）が測定で否定された。note は作業ログで「現行 X → Y に訂正」と捨てた側を書くため突合の向きが反転する。#33・#36 の食い違いも全部この形（2026-08-02）
    source: data/schema/EMPERORS_SCHEMA.md「note と claim」

  - id: R-QUOTE-NO-TYPE
    summary: 原文引用の手打ち禁止。quote_helper.py / grep のツール出力からコピーする
    scope: note・quote に入る正史原文の引用。日本語の地の文・換算メモは対象外
    enforcement: [L2, L3]
    detail: 引用を変えると照合台帳のハッシュが合わず verify_quotes.py --check が落ちる＝**迂回したことが機械に分かる**。この形が本台帳のお手本
    evidence: 全件検証6,504件で転記誤字・圧縮改変・帰属誤り22件（約0.4%・2026-07-22）
    source: docs/process/RESEARCH_PROCESS.md「引用の取り扱い規約」

  - id: R-QUOTE-GLYPH
    summary: 引用は底本の字体のまま保存する（新字体・繁体への変換をモデルが行わない）
    scope: "**原文引用の断片だけ**。同じ note の中でも日本語の地の文・換算メモは新字体で書く"
    enforcement: [L1, L3]
    detail: L1＝.claude/hooks/stop_gate.py（引用・日付を触っていれば流す）／L3＝verify_quotes.py --check（新字体表の助けなしに底本へ当たるか）。逃げ道は quote-refs.json の glyphAllow のみ・理由必須。**照合そのものが失敗しているユニットにはこのゲートが掛からない**ので、正規化を直して照合が通るようになると混入が新たに表へ出る（2026-08-03 に5件）
    evidence: 字体混入684字・431フィールド・181人（2026-08-02）。範囲を書かずに直したため日本語の地の文2件まで旧字体にしてしまい戻した
    source: docs/process/RESEARCH_PROCESS.md 規約2

  - id: R-QUOTE-BOOK
    summary: 引用は「その note・source.page が名乗る書」に実在すること（出典の取り違えを残さない）
    scope: 書名を名乗っている引用ユニットだけ。書名を名乗らない引用・断片が日付表現だけのものは対象外。**構造化引用 `quotes[]` と `source.bookId`/`volume` は名乗りが散文でないので別経路**（verify_quotes.py --check-volumes が巻まで見る）
    enforcement: [L1, L3]
    detail: L1＝.claude/hooks/stop_gate.py（引用・日付を触っていれば --check と一緒に流す。2回目以降は数秒）／L3＝verify_quotes.py --check-books（ローカル専用・要コーパス。CI は回せない）。note 本文・source.page・conversion 本文の和集合を名乗りとして読み、名乗ったどれか1書に全断片が在れば合格。逃げ道は quote-refs.json の bookAllow のみ・理由必須で、**使えるのはコーパス側の欠陥（一書の中で1箇所だけ字が壊れている等）・内篇名の誤読・引用の作り方が原因のときだけ**。書名が実際に違うなら note を直す。**底本の字をそのまま採るとデータが誤りになるなら引用は正字を保って bookAllow へ倒す**（南唐書の「已卯」・明史の「讨症」はどちらも語として成立しない）。bookAllow のキーは `id|path` なので、**同じ note に後から足した引用も黙って許可される**——理由文が説明していない引用が相乗りしていないか、足すときに見る
    evidence: 2026-08-03（Issue #69 計画7節の4）に構造化引用 `quotes[]` と `meta.catalogs.books` を足し、`verify_quotes.py --check-volumes` が「引用が名乗る**巻**の中に在るか」まで見るようにした（`--check-books` は書名しか見ないので巻番号の誤りは全ゲートを緑で通る＝#53 の穴）。実測で識別する — 元世祖の即位記事は元史巻4で8/8断片が一致し巻5・6・17では0/8。99件（72人）を原典に当て直して残件0へ（2026-08-03・Issue #40 G1）。書名そのものの誤りは20件で、残りは検出器・正規化・引用の作り方の側だった。名乗りを note の散文だけから採っていたため、source.page にだけ書名がある形（十国春秋・旧五代史）が全部誤検出になっていた
    source: docs/process/RESEARCH_QA_PLAN_2026-08-02.md 4-4

  - id: R-CLAIMS-FIRST
    summary: 原文を先に読み、引用台帳 claims を作り、note は照合として読む。台帳に無い事実は書かない
    scope: 調査エージェントの出力（新規調査・訂正の両方）
    enforcement: [L0, L1, L2, L3]
    detail: L0＝出力スキーマが claims を必須にするので順序を選べない／L1＝.claude/hooks/guard.py（1段目のサブエージェントが extract_profile_material.py・extract_event_material.py に --notes on を打つと止める）／L2＝.claude/agents/corpus-researcher.md・profile-writer.md・Workflow の schema／L3＝scripts/check_claims.py。**2026-08-02 に順序から分離へ変えた** — 順序を守っても同じ文脈に note が入れば筋書きは効くので、1段目には note を渡さず、突き合わせを検証段の担当にした（素材抽出の既定を --notes off に）。**2026-08-03、規則の穴が「素材抽出コマンドを通さない経路」だと分かった** — 親セッションがプロンプトの中でその場の `python3 -c` を書くと、既定 off も L1 も掛からない。データ訂正側の素材に scripts/extract_event_material.py を用意し、抽出式を書き起こさず**このコマンドを渡す**ことを corpus-researcher と /correct-record に明記した
    evidence: 素材 note を先に読むと note の筋書きに合う原文句を探すことになる。紹介文の誤りの多くが note 由来だった（Issue #32・#33・#36）。Issue #56 では親セッションのワンライナーが note を print しており、調査エージェント4体が「1段目なのに既存 note を見た」と申告した（2026-08-03）
    source: docs/process/CLAIMS_CONTRACT.md（「なぜこの順序なのか」を書いていた docs/process/profile-writing/README.md は 2026-08-04 に削除した）

  - id: R-GATES-BEFORE-COMMIT
    summary: データを変更したら該当ゲートの合格をコミット条件にする
    scope: data/emperors.json・kinship.json・name-readings.json・emperor-profiles.json
    enforcement: [L1, L3, L4]
    detail: L1＝.claude/hooks/stop_gate.py。data/*.json に未コミット差分があるまま turn を終えようとしたら軽いゲート（1秒未満）をその場で流し、落ちていれば止める。**走ったかを帳簿で追わず実際に流す**（記録から judge すると「走ったが落ちていた」を通す）。引用・日付を触っていれば verify_quotes.py --check もここで流す（2026-08-02 に344秒→1秒未満へ短縮したため。フック全体で約1秒）。**--backfill は流さない**（台帳を書き換えるフックは「止めるために data を触る」ことになる。台帳が古ければ --check が落ちるので検出はそちらで足りる）。初回のキャッシュ構築中は40秒で打ち切って止めずに通知だけ出す。止めるのは1回だけ（stop_hook_active）。肖像アセットのように site 側の検証が全部緑でも deploy gate で落ちる経路は残る
    evidence: 遼景宗の即位日1日ズレが note に埋もれて放置。肖像6件を manifest から外して実体ファイルを消さず deploy gate が落ちた（2026-08-01）
    source: CLAUDE.md「コマンド」

  - id: R-RMW
    summary: 並行セッション前提の read-modify-write。対象 id のフィールドだけ更新し meta・他レコードに触らない
    scope: 同じ作業ツリー／worktree 群で共有される data/*.json と進捗ドキュメント
    enforcement: [L1, L4]
    detail: >-
      L1 は R-GIT-ADDALL・R-GIT-STASH として実装済み（巻き込みの主経路）。
      `data/emperors.json` への転記は `scripts/patch_emperor.py` を通す — **読み込み時点の
      sha256 を書き込む直前にもう一度照合し、変わっていたら書かずに落ちる**。その場の
      `python3 -c` にはできない防護がこれで、道具を経由しない書き方そのものは機械で止められない
      （経由しなかったことは検出できないので L4 が残る）
    evidence: 2026-07-21 のフェーズB調査で複数回発生
    source: docs/process/CONSTRAINTS.md

  - id: R-CORPUS-GREP
    summary: コーパスに `.{0,N}KW.{0,N}` 型のコンテキスト抽出 grep を掛けない
    scope: china-history/・daizhigev20/・_corpus_cache/ に対する素の grep と Grep ツール（どちらも ugrep）
    enforcement: [L1]
    detail: guard.py。/usr/bin/grep・rg は無劣化なので通す
    evidence: 単一10MBファイルでメモリ4GB超に暴走し WSL ごと落ちた（2026-07-23）
    source: docs/process/CORPUS_NOTES.md「コーパス検索のメモリ事故対策」

  - id: R-GIT-ADDALL
    summary: git add -A / git add . を使わない。パスを明示する
    scope: すべての git 操作
    enforcement: [L1]
    evidence: 他セッションの並行編集を巻き込む。site 側でも同じ規則
    source: メモリ concurrent-sessions-same-repo

  - id: R-GIT-STASH
    summary: 裸の git stash / git stash pop を使わない。push -u -m でタグを付け apply <sha> で戻す
    scope: すべての git 操作（stash スタックは主リポジトリと全 worktree で共有される）
    enforcement: [L1]
    evidence: 他セッションの退避を奪う経路。現在 worktree は9本
    source: CLAUDE.md「環境」

  - id: R-JSON-READ-MAIN
    summary: メイン会話で data/emperors.json 全体を Read しない。jq / python3 で抽出する
    scope: "**メイン会話のみ**。サブエージェントは対象外（フック入力の agent_id の有無で判別している）"
    enforcement: [L1]
    detail: offset/limit つきの Read は通す
    evidence: トークン消費の96.6%が cache_read。序盤の大きな Read は残り全ターンに複利で効く
    source: docs/process/AI_RESEARCH_LESSONS.md 5節

  - id: R-API-BATCH
    summary: 外部 API への一括リクエストは「小規模検証 → 想定件数を提示して明示的許可 → 本実行」
    scope: >-
      Wikimedia・Wikidata ほか**外部ホスト**への HTTP 取得。ローカルコーパスと
      localhost／127.0.0.1（開発サーバー・`site/tools/capture-site.mjs`）は対象外。
      **`gh` は形では止めない** — GitHub 側がトークン単位でレート管理し、`--paginate` の
      ような正当な連続取得と事故の形が同じになるため。分母としては数える
    enforcement: [L1, L4]
    detail: >-
      L1＝guard.py。**止めるのは件数ではなく「扇形に広げる形」** — 反復構文
      （`for … in` / `while … ; do` / `xargs` / `parallel` / `seq`）か curl の URL グロブ
      （`{a,b,c}`・`[1-100]`）に curl／wget を差した Bash を deny する。閾値を決め打ちすると
      正当な調査を止めるので件数は見ない（Issue #43 の3番）。**1本ずつの curl・WebFetch・
      WebSearch・`gh api` は通すが log には残す** — 0件の deny を「守られている」と読まない
      ための分母。**逃げ道の理由には件数を書く**（許可を得た本実行がこの形になるため、
      escaped がそのまま「許可済みの一括実行」の記録になる）。
      **L4 が残るのは WebFetch の連打** — 1回の呼び出しに形が無く、間隔と件数でしか
      判別できない。閾値は分母（log の pass 件数）が溜まってから決める
    evidence: 肖像画調査で364件を並列実行し429と乱用警告（2026-07-20 以前）。台帳20件のうち L4 だけの規則がこれ1件になっていた（2026-08-02・Issue #43 で L1 を足した）
    source: docs/process/CONSTRAINTS.md

  - id: R-CI-BACKGROUND
    summary: CI の完了待ちは前景で回さず run_in_background で流す
    scope: >-
      push 後の GitHub Actions を待つ操作（`gh run watch`・`until`／`while` ループ・
      `sleep` を挟んだ `gh run`）。**`gh run list` の単発は対象外**で、待つ形だけを見る。
      **「見届けなくてよい」ではない** — 見届ける手順（feedback-merge-to-main-includes-push）は
      そのままで、待ち方だけを変える規則
    enforcement: [L1, L4]
    detail: >-
      L1＝guard.py。`gh run` を含む Bash のうち、`gh run watch` かポーリングの形
      （ループ・`sleep`）を持ち、かつ `run_in_background` が付いていないものを deny する。
      背景で流せば完了時に呼び戻されるので、待ち時間ぶんがそのまま消える。
      **止めるのは形であって待つこと自体ではない** — 直後にマージ判断が要るなど前景で
      待つ理由があるなら逃げ道（EMPSTATS_ALLOW）に書いて通す。
      L4 が残るのは「ターンの中で結果を待たずに次へ進む」判断そのもので、これは形が無い
    evidence: 2026-08-03 のターン所要時間の実測で、15分超のターンにおける `gh run` の待ちが合計103分・1ターン最大7分あった（待っている間は何も進んでいない）
    source: CLAUDE.md「守るべき運用ルール」

  - id: R-PRIMARY-ON-MAIN
    summary: primary（/home/sakis/emperor-stats）は main に置いたままにする。新しい作業は worktree
    scope: リポジトリの作業場所の選択
    enforcement: [L1, L4]
    detail: SessionStart フックが毎回報告する（弱い L1）。ブランチ判定はコミット時の文脈依存なので deny にはしていない
    evidence: 他セッションのブランチ上でコミットした（2026-08-02）
    source: CLAUDE.md「守るべき運用ルール」

  - id: R-WORKTREE-SETUP
    summary: worktree の作業場所は primary と揃える — コーパス4本は symlink、site/node_modules は `cp -al` のハードリンク複製（symlink は Turbopack が拒否する）
    scope: .claude/worktrees/ 以下の作業場所を作ったとき。**primary では何もしない**。node_modules を触るのは site を動かすときだけ（データ専用の worktree には作らない）
    enforcement: [L0, L4]
    detail: 実体は `scripts/setup_worktree.sh`。L0 は2経路で、どちらも人が思い出す必要が無い — (1) `.claude/settings.json` の PostToolUse フック（matcher `EnterWorktree`・`tool_response.worktreePath` を受けてコーパス4本を symlink・7ミリ秒）、(2) `site/package.json` の `predev`/`prebuild` が `site/scripts/ensure-node-modules.mjs` を先に流し、node_modules が無い／symlink なら primary から `cp -al`（約0.75秒・3506ディレクトリぶんの実消費だけでファイル実体は共有）。**(2) は worktree の作られ方に依らない**（EnterWorktree でも `git worktree add` でもサブエージェントの worktree 隔離でも効く）。**node_modules はハードリンクなので、worktree での `npm install`／in-place のパッチ当ては primary 側の実体も書き換える**（npm は unlink→作成なので通常は安全）
    evidence: site/node_modules を primary から symlink したら Turbopack が `Symlink [project]/node_modules is invalid, it points out of the filesystem root` で拒否した（2026-08-02）。コーパス4本の symlink 漏れは**エラーにならず**、コーパス依存のゲート（verify_quotes・quote_helper）が黙ってスキップされる（Issue #36 の作業中に発覚）
    source: site/AGENTS.md「ハマりどころ」・docs/process/COUPLINGS.md「運用側」

  - id: R-SCOPE-ASK
    summary: 規則の適用範囲が書かれていないときは、自分で狭めたり広げたりせずユーザーに聞く
    scope: このリポジトリの全規則（メタ規則）
    enforcement: [L0]
    detail: "**この台帳の scope 欄がこの規則の実装である。** 欄が埋まっていれば聞く必要が無く、空なら聞く"
    evidence: Web 照合の要否を自己解釈して76人ぶんを公開（2026-08-02）
    source: docs/process/AI_RESEARCH_LESSONS.md 11-5

  - id: R-PROCESS-FEEDBACK
    summary: 調査中により良い手順に気づいたら、その場でユーザーへ提案する。採否を PROCESS_IMPROVEMENTS.md に残す
    scope: 調査・訂正・執筆のすべての作業（エージェントも含む）。**提案であって、手順を勝手に変えることではない**
    enforcement: [L1, L2, L4]
    detail: >-
      L1＝.claude/hooks/suggestion_capture.py（Stop）。turn の transcript から、出力契約の
      processSuggestion と報告本文の「手順の提案:」節を拾い、PROCESS_IMPROVEMENTS.md の
      「自動採取」節へ採否 未提示 で書き足す（止めない・重複は本文の sha で弾く）。
      **親セッション自身が地の文で出した提案は機械が読める印が無いので拾えない** —
      そこは python3 scripts/add_suggestion.py --auto を手で呼ぶ。
      検出力は .claude/hooks/test_suggestion_capture.py が合成 transcript で測る
      （誤検出のほうが害が大きいので、拾ってはいけないケースを4件置いてある）。
      L2＝.claude/agents/*.md と .claude/skills/*/SKILL.md に明記。調査エージェントの出力契約に
      任意欄 processSuggestion があり、check_claims.py が REPORT として親へ上げる
    evidence: 手順の穴は調査中に一番よく見えるのに、終わってからは思い出せない。境界事例の都度ルール化が効いた前例（判定基準）と同じ構造
    source: docs/process/PROCESS_IMPROVEMENTS.md

  - id: R-COUPLING
    summary: 片方を変えたらもう片方も変える対を、気づいた時点で結合レジストリに登録する
    scope: データ・サイト・ドキュメントをまたぐ結合すべて
    enforcement: [L3, L4]
    detail: 一覧は docs/process/COUPLINGS.md。台帳と guard.py の対は CI（validate-data.yml）で突合する。**規則違反ではなく「規則が書かれていなかった」型の事故に効く唯一の手当て**
    evidence: 肖像 manifest と実体ファイルの不一致で deploy gate が落ちた（2026-08-01）／表示名を変えて kana-readings.ts の TABLE_SOURCE を直さずビルドが落ちた（2026-08-02）
    source: docs/process/COUPLINGS.md

  - id: R-REGIME-FIRST
    summary: 政権単位で決まること（書式・所在）は政権単位で先に原典から確定し、人物単位の調査はその残りへ絞る
    scope: 悉皆調査（Issue #37 の名前データ・#24 の dynastyOrder のように、同じ問いを政権の全員に投げる作業）
    enforcement: [L0, L3, L4]
    detail: 記録は data/regime-conventions.json。**値を書かない** — 書けるのは「この書はこの位置にこの書式で載せる」という書式・所在と、原典が制度そのものを明言している場合のその明文だけ（「唐は全員に廟号がある」は人物単位の主張で24人読まないと言えない）。L0＝調査プロンプトが `check_regime_conventions.py --for <id>` の出力（書名・所在・書式）を要求し、未確定の政権では人物単位の調査を立てられない（.claude/workflows/name-block.js の regimeConvention は必須欄）／L3＝scripts/check_regime_conventions.py（引用がその file:line に実在するか・打ち切り側は対象政権それぞれに原典の裏があるか）。**絞り込みの誤りは非対称** — 「書式がある」を誤ると余分に読むだけだが、「無い」を誤るとその政権の空欄を全件まとめて正しいと結論する
    evidence: 89政権365人に対し、廟号は「政権の全員が空」が64政権173人・1政権あたり中央値2人。機械の書式当たり（冒頭3行の「讳/諱」）は前漢14人で0件だが、これは廟号が無いのではなく漢書が冒頭に並べないだけで、政権単位に「値」を書いていたら14人ぶん誤って確定していた（2026-08-02）
    source: docs/process/RESEARCH_PROCESS.md・Issue #41 の実施順1

  - id: R-SCREEN-FIRST
    summary: 原典を読む前に機械で前提を検証して母集団を絞り、「母集団 N → 要読解 M」を出してから読み始める
    scope: 悉皆調査のブロック着手（同じ問いを数十〜数百の対象へ投げる作業）。**絞り込みは読む順序と量を変えるだけ**で、判定を機械にさせるわけではない（R-NO-AUTOGEN との境界）
    enforcement: [L0, L3, L4]
    detail: 絞り込みは `scripts/screens/<名前>.py` にコミットして残す（その場の一発コマンドにしない）。記録は data/screenings.json で、**数字はゲートがスクリプトを実行して突き合わせる**ので、データが動けば古い数字は落ちる。バケットは3種 — `read`（要読解）／`corroborated`（独立した計算か原典の明文が前提を積極的に裏付けた）／`absent`（機械が何も見つけなかっただけ）。**absent は不在の証拠ではない**ので、種つき無作為標本を原典で読んで取りこぼし率を測る（標本はスクリプトが引き、ゲートが同じ種で引き直して突き合わせる。人が選んだ標本では区間を言えない）。L0＝調査プロンプトが `check_screenings.py --for <id>` の出力を screenBucket に要求する（.claude/workflows/name-block.js）／L3＝scripts/check_screenings.py
    evidence: 前例では #34 の sxtwl 検査が293件中282件の前提を裏付けて残り20件だけを読めば済み、#38 の quote_diff.py が234件を仕分けた。一方 Issue #37 の名前データで絞り込みを記録して標本監査を掛けたところ、**absent 側の取りこぼしは廟号6件中1件・諡号6件中3件**で、「機械が見つけなかった＝値が無い」は成り立たなかった（2026-08-02）
    source: .claude/skills/research-block/SKILL.md の 0.6 節・Issue #41 の実施順3

  - id: R-DATE-CLAIM-SCOPE
    summary: events の日付が主張するのは「年精度 ＋ 在位境界年の月日」だけで、保存値の深さそのものが主張になる
    scope: >-
      data/emperors.json の回数系8フィールドの `events[]` の日付
      （date・startDate・endDate）。**`reigns[]` は対象外** — 在位日は集計の根
      （exactDays・reignSummary・B-1〜B-4）なので、フル ISO ＋ `datePrecision` のまま据え置く。
      `ages.birthDate`／`deathDate` も同じ「深さ＝主張」に揃えた（2026-08-03・計画7節の3）。
      ただし**在位境界年の規則が掛かるのは `events` だけ** — 生没日は在位の外にあるのが普通で、
      境界年で絞ると意味を持たない。`ages` 側にアーカイブは無い（超過分は埋め草と、
      note 自身が「参考値」「通説により補完」と書いている2値だけで、原典から読んだ月日は1件も無い）
    enforcement: [L0, L3]
    detail: >-
      2026-08-03 のユーザー決定（Issue #69）。**埋め草を廃止**し、値の形から主張が読めるようにする
      （年 `"1211"`・月 `"1211-05"`・日 `"1211-05-07"`）。月日を主張できるのは在位の境界年に在る
      event だけで、それ以外の月日は `data/internal/event-date-archive.json` へ退避してある
      （値は消していない・**内部側はこれ以上精度を追求しない**）。判定は
      `scripts/event_date_scope.py` に1つだけ置き、移行・バリデータ・`verify_calendar`・
      絞り込みが同じ関数を呼ぶ（BCE では `startYear`〈歴史年〉と `startDate` の年〈天文年〉が
      1年ずれるので、2実装に分かれると「移行では丸めたのにゲートが違反と言う」が起きる）。
      L0＝`data/schema/emperors.schema.json` と EMPERORS_SCHEMA.md／L3＝
      `validate_emperors.py` の `check_event_date_format`（深さ ≤ datePrecision・境界年の外に
      月日を置かない）と `check_event_date_archive`（退避した値の鍵が実在の event を指し、
      配布物の値がその接頭辞であること）と `check_ages`（`ages` 側の深さ ≤ precision）。
      検出力は `python3 scripts/test_date_claim_scope.py`。
      **違反 0 件を保つことが主張範囲の凍結**で、新しい event を足したときに黙って主張が
      広がるのを止めるのがこの規則の役目
    evidence: >-
      月日を主張していた 4,337件のうち、原表記 `*Raw` と換算 `source.conversion` を持つものが
      **0件**で、機械では真偽を区別できなかった（`verify_calendar` が B5=0）。検出器を作るたびに
      母集団が現れ（#34 の1,937件・#55 の1,336件・#56 の291件・#62 の9件）、
      「主張している以上ゼロにするしかない」ので終わらなかった。**発散していたのは欠陥ではなく
      主張の面積**で、絞ると 4,337 → 1,173 件の有界な残量になる（2026-08-03）
    source: docs/schema/CLAIM_SCOPE_PLAN_2026-08-03.md・Issue #69

  - id: R-CLAIM-GATED
    summary: 配布物に新しい主張の欄を作るときは、その欄を検査するゲートを同じ変更で足す。書けないなら内部側へ置く
    scope: >-
      `data/emperors.json`・`data/kinship.json` に**新しい欄・新しい意味を足すとき**。
      既存の欄には遡及しない（既存の欄をゲート無しのまま残すことは、この規則の違反ではない）。
      **サイトの表示や docs は対象外** — 掛かるのは配布物が読み手に対してする主張だけ
    enforcement: [L3, L4]
    detail: >-
      2026-08-03（Issue #69）。判断の入口は `data/schema/SCHEMA_CHANGE_CHECKLIST.md` の対応表で、
      **行を足せない欄は配布物に足さず** `data/internal/` へ置く（丸めた月日 6,258値・引用照合台帳が
      その例）。L3＝`scripts/check_rules.py` が対応表の**空欄**と、**名前を挙げたゲート・検出力テストの
      実在**を見る（表の行は見出しからの位置で拾う。「`::` を含む行」で拾うと、検査の欄を空にした行が
      母集団から消えて空欄検査が素通りする）。**L3 が上限で L4 が残る** — 「新しい欄が表を素通りした」
      ことは機械では見られないので、機械が保証するのは**表に書いた名前と実装がずれていないこと**だけ。
      転記がその場で終わらない欄は条件を強制せず**ラチェット**（充足数が減ったら落ちる）にして、
      不足は `RESIDUAL.md` の行にし、「まだ強制していない」と commit に書く
    evidence: >-
      再調査が終わらなくなった系統は**すべて同じ形**だった（Issue #69 の診断表6件）。
      `*Raw`（器を作って中身が **0件**・`verify_calendar` が B5=0）・`source.page`（`--check-books` が
      書名しか見ないので**巻番号の誤りが全ゲートを緑で通る**・#53）・`confidence`（欄ごとに
      「何に対する確信か」が違い横断で読めない・#42）は、どれもゲートが無い／浅いまま欄だけ増えていた。
      検査できない主張を配布物に置くと、後から検出器を作るたびに母集団が現れ、その母集団は
      「主張している以上ゼロにするしかない」ので終わらない（2026-08-03）
    source: docs/schema/CLAIM_SCOPE_PLAN_2026-08-03.md 2節・Issue #69

  - id: R-EVENT-DATE-RAW
    summary: events の日付を新しく確定・訂正したら、原典の紀年表記（*Raw）と換算（source.conversion）を同じ要素に残す
    scope: >-
      data/emperors.json の回数系8フィールドの `events[]` に**新しく書く日付**
      （date・startDate・endDate）。**既存の約2,000件には遡及しない**（欄は任意）。
      reigns は 2026-07 から `startDateRaw`／`endDateRaw`／`duration.source.conversion` を
      持っており、events だけが持っていなかった
    enforcement: [L0, L3, L4]
    detail: >-
      L0＝スキーマに `dateRaw`／`startDateRaw`／`endDateRaw` と `source`（`conversion` を含む）を
      置いた（data/schema/emperors.schema.json・2026-08-03）。L3＝verify_calendar.py の **B-5** が
      `source.conversion` の `fromLunar(y,m,d[,leap])` を再演する。**朔日アンカー
      `fromLunar(y,m,1)` は月精度の主張として扱い、多数月を計算して `→YYYY-MM` や保存値と
      照合する** — 記法を増やさずに月精度の誤りを機械化できる。検出力は
      `python3 scripts/test_event_conversion_gate.py` が合成レコードで測る（**実データは
      2026-08-03 時点で B5=1・残 1,172 なので、0エラーを「守れている」と読まないための分母**）。
      **L4 が残るのは「書いたか」のほう** — 遡及しない任意の欄なので、書かなかったことは
      検出できない。機械が見られるのは「書いたのに合わない」だけ。
      **これを L1／L2 へ上げるか（`patch_emperor.py` が `*Raw` 同時指定なしの `--set` を通さない）は
      未決**で、賛否は PROCESS_IMPROVEMENTS.md の同名の節にある（強制すると
      「ゲートを通すための偽の原表記」が入りうるのが反対側の論拠）
    evidence: >-
      Issue #56（2026-08-03）で親征イベントの終期42件を原典へ当て直したところ24件が誤りで、
      最も多い型が「旧暦の月番号を太陽暦の月欄へ直書き」だった（西夏襄宗 1211-05←旧暦五月は
      西暦5月と1日も重ならない・夏赫連定2件・後燕慕容盛・西夏景宗）。events は原表記を持たない
      ため、**保存値が旧暦の月番号のままか換算済みかを機械で区別できず**、Issue #34 の
      1,937件の換算からも漏れて残った。同じ型は北斉文宣帝に7値・清聖祖に4値が未訂正で残っている（#62）
    source: >-
      data/schema/EMPERORS_SCHEMA.md「events の原表記と換算」・Issue #56。
      親 Issue #68 は 2026-08-03 に close（設計上閉じられない器だった）。残量は
      docs/process/RESIDUAL.md、working knowledge は AI_RESEARCH_LESSONS.md の 9-1

  - id: R-ERA-DATE-DECLARED
    summary: 改元 event の date は「本紀がその改元という行為に日付を付けている条の日」。元号が施行される日を採らない
    scope: >-
      data/emperors.json の **`eraChangeCount[].events[].date` だけ**。**他の7つの回数系
      フィールドには掛からない**（大赦1,338・立后278 などにも「どの条を採るか」の問いはあるが、
      2026-08-03 に実測したのは改元だけ。広げるかは別途のユーザー判断）。
      `R-DATE-CLAIM-SCOPE` により月日を主張できるのは在位境界年の event だけなので、
      **この規則が実際に効くのは日精度で残っている156件**（内部アーカイブ側は追求しない）
    enforcement: [L4]
    detail: >-
      2026-08-03 のユーザー決定（Issue #66）。**「詔の日」と書かない** — 踰年改元で正月朔の条に
      改元記事そのものが立つ形（晋懐帝「永嘉元年春正月癸丑朔，大赦，改元」・金哀宗
      「正大元年正月戊戌朔，诏改元正大」）と、前年の詔を挟まない即時改元（元成宗の大徳）が
      詔という語では逸脱に見える。施行日（多くは翌年正月朔）を採らないのは、原文がその日に
      改元の記事を置いておらず `dateRaw`＋`source.conversion` を持てない＝**機械の証人が作れない**ため。
      **いまは L4（強制力ゼロ）**で、宣言日と施行日を機械で分けられるのは `verify_calendar.py` の
      B-5 による干支リプレイだけ。RESIDUAL.md の「`*Raw`／`conversion` の充足」行の先頭に
      日精度の改元**156件**を置いてあり、そこが埋まった時点で L3 に上がる（→ `R-EVENT-DATE-RAW`）。
      **既知の例外は1件**（2026-08-03 ユーザー決定）＝ `qing-shengzu.eraChangeCount.e001` の
      `1661-02-05`。原文の丙辰は `1661-02-04` だが、清史稿の中で崩日が丙辰と丁巳に割れており
      （丙辰を即位日とすると崩御より前になる）、**原典側が割れているものを規約の一貫性のために
      動かさない**という判断で現状のまま残す。**再提案しない**
    evidence: >-
      Issue #55 の検証段が「日精度の改元 event の指す日が揃っていない」と実測した（#66）。
      規約が明文になっていなかったため、清高宗を 1735-10-08（世宗の崩御日）から
      1735-10-18（即位して建元を宣した日）へ動かす**規約の判断が、訂正作業の中で暗黙に行われた**。
      同じ実測を当て直すと、清11人は「即位日を採った」のではなく「上即位…以明年為○○元年」と
      **即位と建元が同一条**にあるだけで、3通りに見えていたものは1通りだった。
      逸脱していた南宋理宗の8件（翌年正月朔＝施行日）は #69 の丸めで配布物から消えている
    source: data/schema/ADDITIONAL_SCHEMA.md「2. 改元回数」・Issue #66

  - id: R-SWEEP-DETECTION
    summary: 語彙走査の結果を「悉皆だ」の根拠にするときは、その語彙に掛からない該当記事を1件探して検出力を測る
    scope: 原典への機械走査（grep・キーワード列挙）の結果を、**値や確度の根拠として主張する**とき。訂正・確度確定・悉皆調査のいずれでも掛かる。走査を読む順序の道具として使うだけなら R-SCREEN-FIRST の側
    enforcement: [L2, L4]
    detail: 「この語で全文を走査し、該当は N 件だけだった」は**走査の結果**であって不在の証拠ではない。主張に使う前に、**その語彙に掛からない該当記事を1件探しに行く**（見つかれば走査は検出器として機能しておらず、別の根拠＝判定基準の適用範囲などに置き換える）。R-SCREEN-FIRST の「機械が何も見つけなかった側（`absent`）は種つき標本で取りこぼし率を測る」の**陽性側の版**で、狙いは同じ「機械の沈黙を証拠に格上げしない」。L2＝`.claude/agents/adversarial-verifier.md` が渡された悉皆性の主張に対してこの検定を掛ける
    evidence: Issue #42（2026-08-02）で元世祖の親征3件を「元史 巻4〜17 に『亲征／自将／亲率／亲将／亲讨／车驾亲征』を掛けて帝主語は4箇所だけ」を根拠に high としたところ、検証段が**同じ本紀の中から**語彙に掛からない出征記事を2件（1253 大理「帝由中道」「帝既入大理」・1259 鄂州「帝驻浒黄洲」「围鄂」）一発で見つけた。件数は動かなかった（どちらも実権掌握期の外で、原文が「吾奉命南来」「我奉命南征」と憲宗の命による出征だと明記）が、**根拠の立て方が誤っていた**
    source: Issue #42 の検証段・docs/process/PROCESS_IMPROVEMENTS.md（2026-08-02）

  - id: R-RESIDUAL-TABLE
    summary: 既にある系統の走査結果・横展開で出た同型の疑いは、新しい Issue を立てず docs/process/RESIDUAL.md に行を足す
    scope: 走査・横展開の結果のうち**量として残るもの**（「母集団 N のうち M 件が未読」「同型の疑いが K 件」）。直し方が決まっていて残件数の話になっているもの。**直し方・定義・設計の判断が要るものは対象外**で、そちらは Issue が正しい器（#58 の在位開始日を動かすか・#66 の改元日の定義）
    enforcement: [L1, L2, L4]
    detail: >-
      Issue は**片づけ方が1つに決まる問題**を持つ器で、量を持つには向かない。量は本数ではなく
      行数で増えるべきなので `docs/process/RESIDUAL.md` へ足す。**表は Issue 本文ではなく
      リポジトリに置く** — 親 Issue を閉じた瞬間に消える場所へ規則を向けない。
      L1＝`.claude/hooks/guard.py` が `gh issue create` を**一度だけ止める**。
      **止めるのは「新しい系統かどうか」ではなく形**（R-API-BATCH と同じ設計）で、
      機械には同系統かを判定できないので、判定するのは人のほう。逃げ道は
      `EMPSTATS_ALLOW=R-RESIDUAL-TABLE:<理由>` の1本で理由は必須。
      L2＝`.claude/agents/corpus-researcher.md` が走査で出た未読件数を `processSuggestion` へ
      「残量表 <系統名> N件」の形で返す（Issue の起票を勧めない）。
      **L3 は無い** — 「行を足さなかった」は検出できない。書かれた行の質（未走査と0件の書き分け・
      absent 側の取りこぼし率を測ったか）も機械では見られないので、そこは L4 のまま
    evidence: >-
      2026-08-02〜08-03 に #40 の訂正1件から横展開が連鎖して Issue が28本立ち、13本を閉じても
      15本が open のまま増え続けた（ユーザーの申告「キリがない」）。実測すると6本
      （#55・#56・#57・#62 ＋ #63・#67 の一部）は**同じ穴が別の場所から顔を出しただけ**で、
      根本原因は `events[]` が `reigns` と違い `*Raw`／`conversion` を持たないという設計の1点だった。
      本数が増えたのは欠陥が増えたからではなく、**量を置く場所が無かった**ため
    source: Issue #68・2026-08-03 のユーザー決定（「1本の親 Issue にする」「強制層へ載せる」）

  - id: R-COVERAGE-MEASURED
    summary: 悉皆作業の完了判定は自己申告ではなくデータ本体からの実測に置き、進捗表記はスクリプトの出力そのものにする
    scope: 悉皆調査の進捗表記（docs/PROJECT_STATUS.md のフェーズ進捗・`meta.status.phases`）とブロック完了の宣言。**個々の値が正しいかは見ない**（それは validate_emperors.py と原典調査の担当）
    enforcement: [L3, L4]
    detail: 進捗は `scripts/coverage.py` が data/emperors.json・kinship.json・emperor-profiles.json から測り、docs/PROJECT_STATUS.md の `<!-- coverage:begin -->` … `:end` へ `--write` で書き込む。**「フィールドが在るか」ではなく「確定したか」**を数え、セルは3状態（`filled`／構造的な根拠のある `absent`／`unknown`）。**note の散文からは確定を読み取らない**（note は作業ログで向きが反転する。Issue #40 の G2/G3 が測定で否定された経路）ので、確定の根拠が散文にしか無い項目は unknown 側へ落ちる — それが所見であって、スクリプトがどちらかへ寄せるものではない。L3＝`coverage.py --check`（CI・Stop フック。data/emperors.json・kinship.json・emperor-profiles.json のいずれかを触れば流れる）
    evidence: グループ2の「364人完了」がチェックリスト上の自己申告で、実測は355人だった（2026-07-18・明清交替期群雄9名がブロック一覧から漏れていた）。唐哀帝の収録漏れを見つけたのもエージェントではなく在位年カバレッジの機械集計。導入時の実測では、`completed` の16項目5858セルのうち637セル（10.9%）が構造だけでは確定と読めなかった（`ages` 4項目557セル・在位日80セル）
    source: Issue #41 の実施順4

  - id: R-VERIFY-TIER
    summary: 検証段の体数はブロックごとの判断ではなく政権の史料形態から引く（本紀が立つ王朝は1体・載記/類書/別史/地方志に依存する政権は3体）
    scope: 調査・執筆の**検証段**（`adversarial-verifier` を立てる段）の体数と観点。**指摘の中身が正しいかは見ない**（それは検証エージェント自身と親セッションの担当）。Web 差分検出（`profile-webdiff`）は別機能なので tier の対象外で全員1体のまま
    enforcement: [L2, L3, L4]
    detail: 記録は `data/verification.json`。tier は `own-annals`（正史が一代通しの独立記述を立てる。本紀・帝紀、および三国志の主傳のように体裁は伝でも一代を通すもの）＝1体〔`facts`〕と、`dependent`（載記・類書・別史・地方志・他政権の列伝に散る）＝3体〔`facts`・`kinship`・`dates`〕の2つだけ。**体数は tier から一意に決まり、行ごとに書き換えられない**（`check_verification.py` が突き合わせる）。**記録に無い政権は既定で `dependent`（厚い側）** — 載せ忘れが薄い側へ倒れるとその政権の誤りをまとめて通すため。**1体へ減らす側にだけ書名・所在・体裁の根拠を要求する**。**政権の判定を人物に被せない** — 所在が違う人物は tier 行の `exceptions`（`personIds`・`tier`・`reason`）で外す（舊唐書の殤帝ら4人）。L2＝`.claude/workflows/name-block.js` が調査段の返した tier で体数を変える／`.claude/agents/adversarial-verifier.md` が観点の指定に従う。**0件・低件数の主張を渡すときは、原典の当たり直しと並行して当該フィールドの除外規定を条文単位で当てさせる**（欠陥が原文の不在ではなく条文の未適用として現れるため。Issue #42 → #48 の倪文俊件）、L3＝`check_verification.py`（CI・Stop フック）。**紹介文の側は L2 が無い**（`profile-block.js` が無く、親セッションが `--for` を見て体数を決める＝実質 L4）。**指摘率の記録そのものも L4** で、ブロックを終えて `blocks` に1行足さなかったことは誰も検出しない — 完了条件が強制力ゼロの手順にぶら下がっている。**Web 差分（`profile-webdiff`）は `own-annals` でも落とさない**（2026-08-03 ユーザー決定・Issue #43）— 再配分は 365→627体（+72%）で「総コストをほぼ変えずに」を満たしておらず、中立に寄せる余地は `own-annals` の3段目を落とすことだけだが、「本紀が立つ政権なら Web の拾いも少ない」という期待は未検証だった。落とさずに歩留まり（`blocks[].webdiff` の `raised`／`confirmed`）を測り始め、`own-annals` 側で1〜2ブロック溜まってから決める。**書き忘れは `check_verification.py` が警告する**（`raised`／`confirmed` 本体より一段強い）
    evidence: 紹介文76人の欠陥密度が一様でなく3段の階段だった（2026-08-02 実測）— 前漢・後漢・三国 43人＝0件／晋 15人＝6件・0.40件/人（Issue #32・#33）／小政権6＋五胡十六国12の18人＝28件・**1.56件/人**（Issue #36）。**同じ2段で回してこの差が出た**。ただし晋も本紀を持つ政権なので、史料形態が説明するのは3段のうち下2段だけ（残りは同一レコード内の食い違い・note の陳腐化で、Issue #40 のゲートの担当）
    limits: 体数と欠陥密度は交絡するので、体数の効果は**同じ tier のブロック同士**でしか読めない。tier をまたいで指摘率を比べても体数の効果は出ない。**読む数字を取り違えない** — `confirmed/raised` は検証段の精度で、観点を2つ足せば下がってもおかしくない。再配分が効いたかを示すのは **`dependent` ブロックの `escapes` が下がるか**（2体で 1.56件/人 が基準。次の後趙7人は4体）
    source: Issue #41 の実施順5


  - id: R-RELATION-PATH
    summary: 続柄は呼称を選ばず「誰の子の子か」で返し、呼称はグラフから導く
    scope: 調査エージェントの `findings` に書く続柄と、note・紹介文に書く続柄の呼称。**血縁エッジそのものの正しさは対象外**（それは `validate_kinship.py` の担当）
    enforcement: [L2, L4]
    detail: 呼称は `scripts/relation_path.py` が `data/kinship.json` の血縁エッジから導く（`--for <皇帝id>`／`--between A B`）。L2＝`.claude/agents/corpus-researcher.md`・`docs/process/CLAIMS_CONTRACT.md`（出力契約）／L4＝`CLAUDE.md`・`COUPLINGS.md`。**L0 にはなっていない** — エージェントが呼称を書けてしまう経路は残るので、消えたのは「選ばなければならない」だけで「選べる」ではない。**機械で止める層も作らない** — 散文中の続柄語を拾って突き合わせる案は Issue #40 G3 で測って捨てた（否定・第三者・連鎖が多数を占め、続柄語354件のうち先代を指すものが2割に満たない）。`--check` は記録値との突合を報告するだけで **CI に載せない**（不一致は「エッジと記録値のどちらかが誤り」までしか言えず、非ゼロで返すと抑制リストが足されて読まれなくなる）。**導出の出力を根拠にデータを書き換えない** — 誤っているのがエッジの側のことがある
    evidence: Issue #36 の A類型6件は、同一レコードの別フィールドが正しい関係を持ちながら散文へ落とす段で呼称を取り違えていた（`deathCause.note` は張耀霊を「従兄弟」と書くが、同じレコードの軸は `uncle-elder`）。導出器を succession エッジ全件へ掛けると255件中254件が一致し、残る1件（曹芳→曹髦が `cousin` だが再従兄弟）は Issue #53 へ落とした
    source: docs/process/RESEARCH_QA_PLAN_2026-08-02.md 4-2b

measurement:
  # 0件の deny は「守られている」と「そもそも掛かっていない」を区別しない。
  # 規則ごとに分母（守るべき操作が何回起きたか）を数える。
  log: .claude/hook-log.jsonl   # decision は pass / deny / escaped の3値。pass の件数が分母
  watch:
    - guard.py が対象にしている操作の発生件数が0のままなら、規則が掛かっていないか記法が変わった疑い
    - escaped が続く規則は、規則のほうが実態に合っていない
    - 調査エージェントの起動のうち .claude/agents/ の定義を経由した割合（L2 が外れていないか）
